{{template "header".}}

<div class="calculations">
    <div class="volume">
        Укажиет объем выпуска
        <div class="volume input">
            1-й выпуск
            <div class="input_volume">{{.costRequest.Min_release_volume}}</div>
        </div>
        <div class="volume input">
            2-й выпуск
            <div class="input_volume">{{.costRequest.Max_release_volume}}</div>
        </div>
    </div>
    <!-- <a class="button_calculate"> Рассчитать эффект масштаба</a> -->
    <div class="ratio">
        Коэффициент: {{.costRequest.Ratio}}
        <p style="padding-top: 8px;">Положительный эффект масштаба</p>
    </div>
    <form action="/cost_request/{{.costRequest.ID}}" method="post">
        <input type="hidden" name="request-id" value="{{.costRequest.ID}}" />
        <button type="submit" class="delete_request">Удалить</button>
    </form>
</div>

<div class="request">
    {{range.costRequest.Entries}}
        <div class="request_conteiner">
            <div class="class center">
                <div class="card">
                    <h3> 
                        {{.Cost.Title}}
                    </h3>
                    <img src="{{.Cost.Img}}" style="width: 80%; height: 80%; margin-top: 3%; margin-bottom: 5%;">
                </div>
            </div>

            <div class="cost_navigation">
                <div class="request_navigation">
                    <div class="cost_price">
                        Стоимость
                        <div class="input_price">
                            {{.Cost_price}}
                        </div>
                    </div>
                    <!-- <img src="/static/img/bin.png" style="height: 45px; width: 35px; cursor: pointer; margin-left: 10%; margin-top: 5%;" alt="Удалить"> -->
                </div>
            </div>
        </div>
    {{end}}
</div>
